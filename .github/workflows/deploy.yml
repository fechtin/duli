name: Deploy

# Auto-deploys the Worker + SPA to Cloudflare on every push to main.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with "Edit Cloudflare Workers" + D1 edit
#   CLOUDFLARE_ACCOUNT_ID — account B id (f88f5e7c7136bf1e6242c019433252fc)
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ambient video clips (docs/030 §8.2) are generated, not committed — 45 MB of derived files
      # do not belong in git history. Encoding all of them takes ~30 min, so the rendered output is
      # cached against the inputs that determine it: the photo manifest and the generator itself.
      # A cache hit makes the render step a no-op; a miss re-renders only what is missing.
      - name: Restore ambient video cache
        uses: actions/cache@v4
        with:
          path: |
            public/video
            scripts/.video-oversize.json
          key: ambient-video-${{ hashFiles('src/data/generated/image-manifest.json', 'scripts/build-video.mjs') }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render ambient video clips
        run: npm run video:build

      - name: Check video budget
        run: npm run check:video

      - name: Build SPA
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Apply D1 schema migrations (idempotent — no-op when nothing is pending).
      # Content re-seeding is NOT done here (destructive); run `bash scripts/deploy.sh`
      # locally when seed data changes.
      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply atlas_db --remote

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
