name = "go"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f88f5e7c7136bf1e6242c019433252fc"

# go.fechtin.com được route vào worker này qua Cloudflare for SaaS
# (custom hostname + Worker Route cấu hình thủ công trên dashboard) — không dùng
# custom_domain của wrangler vì zone fechtin.com nằm ở account khác.

# Resolve the "@/..." source alias when esbuild bundles the Worker.
[alias]
"@" = "./src"

# Serve the built SPA; the Worker handles /api/* and falls back to static assets.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
#
# Note: "/" matches dist/index.html and is therefore answered by the asset layer without ever
# reaching the Worker, so the homepage cannot be rewritten by worker/meta.ts. Its canonical and
# its crawler-visible links live in index.html instead. `run_worker_first` is deliberately NOT
# used to force "/" through: listing routes there inverts the default for everything else, and
# with SPA not_found_handling every unlisted path (/api/*, /vn/*) gets swallowed by the shell.

# D1 — content source of truth (Bible 013). Local dev uses miniflare's SQLite (no account).
# For remote deploy, replace database_id with the real id from `wrangler d1 create atlas_db`.
[[d1_databases]]
binding = "DB"
database_name = "atlas_db"
database_id = "275462e3-549f-40e2-8c23-9d025703f1df"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "atlas-uploads"
